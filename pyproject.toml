[project]
name = "agents"
version = "0.1.0"
description = "Updated Agentic AI Course Workspace"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.92.0",
    "ag2[openai]>=0.11.5",
    "autogen-agentchat>=0.7.5",
    "bs4>=0.0.2",
    "crewai>=1.13.0",        # Added: Core orchestration framework
    "crewai-tools>=1.14.0",  # Added: Standard toolsets for CrewAI agents
    "gradio>=6.11.0",
    "httpx>=0.28.1",
    "ipywidgets>=8.1.5",
    "langchain>=1.2.15",
    "langchain-anthropic>=0.3.10",
    "langchain-community>=0.3.20",
    "langchain-experimental>=0.3.4",
    "langchain-openai>=0.3.9",
    "langgraph>=0.3.18",
    "langgraph-checkpoint-sqlite>=2.0.6",
    "langgraph-sdk>=0.3.13",
    "langsmith>=0.3.18",
    "lxml>=5.3.1",
    "mcp-server-fetch>=2025.1.17",
    "mcp[cli]>=1.5.0",
    "openai>=1.99.0,<2.0.0",
    "openai-agents>=0.0.15",
    "playwright>=1.51.0",
    "plotly>=6.0.1",
    "polygon-api-client>=1.14.5",
    "psutil>=7.0.0",
    "pypdf>=5.4.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "semantic-kernel<=1.41.1",
    "sendgrid>=6.11.0",
    "setuptools>=78.1.0",
    "smithery>=0.1.0",
    "speedtest-cli>=2.1.3",
    "wikipedia>=1.4.0",
    "ollama>=0.6.1",
    "instructor>=1.12.0",
    "chardet<6.0.0",
    "urllib3<2.5.0",
    "langchain-ollama>=1.1.0",
    "langchain-groq>=1.1.2",
    "langchain-chroma>=1.0.0",
    "langchain-huggingface>=1.2.2",
    "sentence-transformers>=5.5.1",
    "einops>=0.8.2",
    "langchain-pinecone>=0.2.13",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "pymongo>=4.16.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true